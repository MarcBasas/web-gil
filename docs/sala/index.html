<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gil Farrés · Sala</title>
  <meta name="description" content="Recorregut per l’obra de Gil Farrés: instal·lacions, escenografia i la marca FARS.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#26282b">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/viewer.css">
  <link rel="stylesheet" href="sala.css">

<body>
  <a class="skip-link" href="#sales">Salta a les sales</a>

  <header class="bar">
    <a class="bar__brand" href="#entrada" data-room="entrada">Gil Farrés</a>
    <details class="menu" id="menu">
      <summary>Sales</summary>
      <nav aria-label="Sales" id="nav"></nav>

    <div class="stage">
      <div class="track" id="track"></div>

    <p class="hud__hint" id="hint">Desplaça’t per recórrer la sala</p>

  <noscript><p style="position:fixed;inset:auto 1rem 1rem;color:#fff">Aquest web necessita JavaScript per mostrar les sales.</p></noscript>
